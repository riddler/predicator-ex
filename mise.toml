# mise config for predicator: toolchain pins.
#
#   mise install        provision the toolchain below
#
# CI reads these pins out of this file (see .github/workflows/ci.yml), so this
# is the single source of truth for the toolchain CI runs. mix.exs declares
# `elixir: "~> 1.18"`; widening or narrowing what predicator supports is a
# mix.exs change, not a change here.

[tools]
erlang = "27.3"
elixir = "1.18.3-otp-27"
